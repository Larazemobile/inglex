function merge(d){var x=defaults();function deep(a,b){Object.keys(a).forEach(function(k){if(a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])){b[k]=b[k]||{};deep(a[k],b[k])}else if(b[k]===undefined)b[k]=a[k]})}deep(x,d);return d}

function $(id){return document.getElementById(id)}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function sfx(type){if(!soundOn())return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!SND.ctx)SND.ctx=new AC();var ctx=SND.ctx;if(ctx.state==="suspended")ctx.resume();var seq,wave="triangle";if(type==="ok")seq=[[660,0,.09],[990,.07,.12]];else if(type==="bad"){seq=[[180,0,.22]];wave="square"}else if(type==="tap")seq=[[540,0,.05]];else if(type==="medal")seq=[[523,0,.1],[659,.1,.1],[784,.2,.16]];else if(type==="win")seq=[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.32,.2]];else if(type==="start")seq=[[392,0,.09],[523,.09,.09],[784,.18,.18]];else seq=[[600,0,.08]];for(var i=0;i<seq.length;i++){var n=seq[i],o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.value=n[0];o.connect(g);g.connect(ctx.destination);var t0=ctx.currentTime+n[1];g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+n[2]);o.start(t0);o.stop(t0+n[2]+.03)}}catch(e){}}
var ENGLISH_VOICE=null;
function voiceScore(v){var n=String(v.name||"").toLowerCase(),l=String(v.lang||"").toLowerCase(),score=l.indexOf("en-")===0?20:-1000;if(l==="en-gb")score+=16;else if(l==="en-us")score+=12;if(/premium|enhanced|natural|neural/.test(n))score+=120;if(/samantha|daniel|serena|martha|karen|moira|tessa/.test(n))score+=75;if(/google uk english|microsoft.*(sonia|libby|ryan|ava|jenny)/.test(n))score+=80;if(/compact|espeak/.test(n))score-=180;if(v.localService)score+=5;return score}
function bestEnglishVoice(){if(ENGLISH_VOICE)return ENGLISH_VOICE;if(!window.speechSynthesis||typeof speechSynthesis.getVoices!=="function")return null;var voices=speechSynthesis.getVoices().filter(function(v){return String(v.lang||"").toLowerCase().indexOf("en-")===0});voices.sort(function(a,b){return voiceScore(b)-voiceScore(a)});ENGLISH_VOICE=voices[0]||null;return ENGLISH_VOICE}
function webSpeak(text,attempt){if(!window.speechSynthesis)return;var voice=bestEnglishVoice();if(!voice&&typeof speechSynthesis.getVoices==="function"&&!speechSynthesis.getVoices().length&&(attempt||0)<3){setTimeout(function(){webSpeak(text,(attempt||0)+1)},90);return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice&&voice.lang?voice.lang:"en-GB";u.rate=.92;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}
if(window.speechSynthesis&&typeof speechSynthesis.addEventListener==="function")speechSynthesis.addEventListener("voiceschanged",function(){ENGLISH_VOICE=null;bestEnglishVoice()});bestEnglishVoice();
function speak(text){if(!soundOn())return;var p=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.OrbitakidxSpeech;if(p&&p.speak){var call=p.speak({text:text,language:"en-GB"});if(call&&call.catch)call.catch(function(){webSpeak(text)});return}webSpeak(text)}
var ADVENTURE_AUDIO=null,ADVENTURE_AUDIO_TOKEN=0;
function stopNarration(){ADVENTURE_AUDIO_TOKEN++;if(ADVENTURE_AUDIO){ADVENTURE_AUDIO.pause();ADVENTURE_AUDIO.removeAttribute("src");ADVENTURE_AUDIO.load()}if(window.speechSynthesis)speechSynthesis.cancel()}
function speakAdventure(text,storyId,sceneIndex){if(!soundOn())return;if(typeof Audio!=="function")return speak(text);if(!ADVENTURE_AUDIO)ADVENTURE_AUDIO=new Audio();var audio=ADVENTURE_AUDIO,token=++ADVENTURE_AUDIO_TOKEN,fellBack=false;audio.pause();audio.onerror=null;audio.removeAttribute("src");audio.load();function fallback(){if(fellBack||token!==ADVENTURE_AUDIO_TOKEN)return;fellBack=true;speak(text)}audio.onerror=fallback;audio.src="assets/audio/adventures/"+storyId+"-s"+(sceneIndex+1)+".mp3";audio.preload="auto";var play=audio.play();if(play&&play.catch)play.catch(fallback)}

function renderHome(){var s=DATA.stats;$("screen").innerHTML='<section class="hero block"><div class="big-av">'+avatarSVG(DATA.avatar)+'</div><div class="htxt"><h2>¡Hola, '+esc(DATA.name||"jugador")+'!</h2><p>'+course().label+' · '+(DATA.grade>=3?'Frases, escucha y comprensión.':'Inglés paso a paso.')+'</p><div class="stat-row"><span class="stat">✅ <b>'+s.correct+'</b> aciertos</span><span class="stat">🔥 mejor racha <b>'+s.best+'</b></span><span class="stat">🏅 <b>'+achievementCount()+'</b>/12 medallas</span></div></div><div class="today-hearts"><span class="th-lbl">Hoy</span>'+heartsHTML()+'</div></section><div class="section-title">ELIGE TU MUNDO</div><section class="grid">'+card("globe","Palabras","Aprende vocabulario por temas","showThemes('study')","var(--teal)",false)+card("sound","Escucha","Oye la palabra y elige","showThemes('listen')","var(--blue)",false)+card("abc","Frases","Ordena las palabras","startSentences()","var(--coral)",false)+card("book","Reading","Lecturas y miniaventuras","showStoryModes()","var(--purple)",DATA.grade>=3&&!OrbitakidxAccess.hasFullAccess())+card("target","Examen","Mezcla todo lo aprendido","startExam()","var(--gold)",!OrbitakidxAccess.hasFullAccess())+card("trophy","Logros","Medallas y progreso","showAchievements()","var(--green)",false)+'</section>'}

function showThemes(mode){
 var themes=courseThemes(),listen=mode==="listen",h=backBar(listen?"Escucha y elige":"Mundos de palabras")+'<div class="panel block"><p class="sub">Contenido recomendado para '+course().label+'. Puedes cambiar el curso arriba.</p><div class="theme-grid">';

 themes.forEach(function(t,i){var c=(DATA.themes[t.id]&&DATA.themes[t.id].correct)||0;h+='<div class="theme'+lockClass(themeOpen(i))+'" style="--world:'+t.color+'" onclick="'+(listen?'startWordQuiz('+i+',\'listen\')':'openStudy('+i+')')+'"><div class="big">'+t.emoji+'</div><b>'+t.name+'</b><small>'+t.description+'</small><div class="progress"><i style="width:'+Math.min(100,c*10)+'%;background:'+t.color+'"></i></div></div>'});

 if(!listen)h+='<div class="theme activity-theme'+lockClass(themeOpen(themes.length))+'" style="--world:#7b5cff" onclick="startPairs()"><div class="big">🃏</div><b>Parejas</b><small>Une cada palabra con su significado</small><div class="progress"><i style="width:'+Math.min(100,(DATA.stats.pairs||0)*5)+'%;background:#7b5cff"></i></div></div>';

}
function openStudy(i){if(!requireTheme(i))return;sfx("start");STUDY={themes:courseThemes(),theme:i,index:0,mixed:false};renderStudy()}function openMixed(){var i=courseThemes().length;if(!requireTheme(i))return;sfx("start");STUDY={themes:[mixedTheme()],theme:0,index:0,mixed:true};renderStudy()}function renderStudy(){var t=STUDY.themes[STUDY.theme],w=t.words[STUDY.index],practice=STUDY.mixed?"startMixedQuiz('meaning')":"startWordQuiz("+STUDY.theme+",'meaning')";$("screen").innerHTML=backBar(t.name)+'<div class="study block"><div class="eyebrow">PALABRA '+(STUDY.index+1)+' DE '+t.words.length+'</div><div class="word-emoji">'+w.emoji+'</div><div class="english">'+w.en+'</div><div class="spanish">'+w.es+'</div><button class="speaker" onclick="speak(\''+w.en.replace(/'/g,"\\'")+'\')">🔊</button><div class="actions"><button class="btn ghost" onclick="studyMove(-1)">←</button><button class="btn green" onclick="studyMove(1)">Siguiente →</button></div></div><div class="actions"><button class="btn coral" onclick="'+practice+'">Practicar</button></div>';setTimeout(function(){speak(w.en)},180)}function studyMove(d){sfx("tap");var t=STUDY.themes[STUDY.theme];STUDY.index=(STUDY.index+d+t.words.length)%t.words.length;renderStudy()}

function showProgress(){sfx("tap");var h=backBar("Pasaporte de inglés")+'<div class="panel block"><p class="sub">Progreso de '+course().label+'.</p><div class="theme-grid">';courseThemes().forEach(function(t,i){var c=(DATA.themes[t.id]&&DATA.themes[t.id].correct)||0;h+='<div class="theme'+lockClass(themeOpen(i))+'" style="--world:'+t.color+'" onclick="openStudy('+i+')"><div class="big">'+t.emoji+'</div><b>'+t.name+'</b><small>'+c+' aciertos</small><div class="progress"><i style="width:'+Math.min(100,c*10)+'%;background:'+t.color+'"></i></div></div>'});h+='</div></div>';$("screen").innerHTML=h}
updateTop();renderHome();if(DATA.onboarded)$("splash").style.display="none";OrbitakidxAccess.init().then(renderHome);window.scrollTo(0,0);
</script>
