r:var(--soft)}.footer{text-align:center;color:var(--soft);font-weight:700;font-size:12px;margin-top:28px}.footer a{color:var(--teal-d)}.wintro p{font-weight:750}

<script>
"use strict";
var CONTENT=window.INGLEX_CONTENT,STORE_KEY="inglex_v1",memFallback=null;
function defaults(){return{name:"",avatar:0,grade:3,onboarded:false,sound:true,stats:{correct:0,answered:0,best:0,streak:0,sessions:0,listen:0,sentences:0,reading:0,perfect:0},themes:{},achievements:{}}}
function merge(d){var x=defaults();function deep(a,b){Object.keys(a).forEach(function(k){if(a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])){b[k]=b[k]||{};deep(a[k],b[k])}else if(b[k]===undefined)b[k]=a[k]})}deep(x,d);return d}
function load(){try{var r=localStorage.getItem(STORE_KEY);if(r)return merge(JSON.parse(r))}catch(e){}return memFallback||defaults()}function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA))}catch(e){memFallback=DATA}}
var DATA=load(),QUIZ=null,STUDY=null,SENT=null,READ=null;
function $(id){return document.getElementById(id)}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function course(){return CONTENT.courses[DATA.grade-1]}function courseThemes(){return CONTENT.themes.filter(function(t){return t.grade<=DATA.grade})}function enterApp(){$("splash").style.display="none";sfx("start");if(!DATA.onboarded)editProfile(true)}
function updateTop(){$("chipAv").innerHTML=avatarSVG(DATA.avatar);$("chipName").textContent=DATA.name||"Explorador";$("chipMedals").textContent=achievementCount();$("courseChip").textContent=course().short;updateSoundBtn()}
var SND={ctx:null};
function soundOn(){return DATA.sound!==false}
function updateSoundBtn(){var b=$("soundBtn"),on=soundOn();if(!b)return;b.innerHTML=on?'<svg width="22" height="22" viewBox="0 0 24 24" fill="#23263d"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a4 4 0 010 7" fill="none" stroke="#23263d" stroke-width="2"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#aab0c4"/><line x1="16" y1="9.5" x2="22" y2="14.5" stroke="#aab0c4" stroke-width="2"/><line x1="22" y1="9.5" x2="16" y2="14.5" stroke="#aab0c4" stroke-width="2"/></svg>'}
function toggleSound(){DATA.sound=!soundOn();save();updateSoundBtn();if(soundOn())sfx("tap")}
function sfx(type){if(!soundOn())return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!SND.ctx)SND.ctx=new AC();var ctx=SND.ctx;if(ctx.state==="suspended")ctx.resume();var seq,wave="triangle";if(type==="ok")seq=[[660,0,.09],[990,.07,.12]];else if(type==="bad"){seq=[[180,0,.22]];wave="square"}else if(type==="tap")seq=[[540,0,.05]];else if(type==="medal")seq=[[523,0,.1],[659,.1,.1],[784,.2,.16]];else if(type==="win")seq=[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.32,.2]];else if(type==="start")seq=[[392,0,.09],[523,.09,.09],[784,.18,.18]];else seq=[[600,0,.08]];for(var i=0;i<seq.length;i++){var n=seq[i],o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.value=n[0];o.connect(g);g.connect(ctx.destination);var t0=ctx.currentTime+n[1];g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+n[2]);o.start(t0);o.stop(t0+n[2]+.03)}}catch(e){}}

function speak(text){if(!soundOn())return;var p=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.OrbitakidxSpeech;if(p&&p.speak){var call=p.speak({text:text,language:"en-GB"});if(call&&call.catch)call.catch(function(){webSpeak(text)});return}webSpeak(text)}

function editProfile(first){var av="";AVATARS.slice(0,12).forEach(function(a,i){av+='<button class="avatar '+(i===DATA.avatar?'sel':'')+'" onclick="pickAvatar('+i+')" aria-label="'+a.name+'">'+avatarSVG(i)+'</button>'});showModal('<h2>'+(first?'¡Bienvenido a IngleX!':'Tu perfil')+'</h2><p class="sub">Elige tu personaje y escribe tu nombre.</p><input class="name-input" id="nameInput" maxlength="14" placeholder="Tu nombre" value="'+esc(DATA.name)+'"><div class="avatar-row">'+av+'</div><button class="btn coral full" onclick="saveProfile('+(first?'true':'false')+')">Continuar</button>',!!first)}

function backBar(title){return'<div class="back-bar"><div class="btn ghost sm" onclick="goHome()">⟵ Inicio</div><div class="qmeta" style="font-size:13px">'+esc(title)+'</div></div>'}function lockClass(open){return open?'':' locked'}function themeOpen(i){return OrbitakidxAccess.hasFullAccess()||i<2}function requireTheme(i){if(themeOpen(i))return true;OrbitakidxAccess.showPaywall();return false}
function iconPath(n){switch(n){case"globe":return'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9z" fill="none" stroke="currentColor" stroke-width="2"/>';case"sound":return'<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="2.4"/>';case"abc":return'<path d="M3 18l3-10 3 10M3.8 15h4.4" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="14" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/>';case"book":return'<path d="M4 4h7v16H4z"/><path d="M13 4h7v16h-7z"/>';case"target":return'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="12" r="1.5"/>';case"star":return'<polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/>';case"trophy":return'<path d="M6 3h12v4a6 6 0 01-12 0V3z"/><rect x="10" y="12" width="4" height="5"/><rect x="7" y="17" width="10" height="3"/>';default:return'<circle cx="12" cy="12" r="9"/>'}}
function card(icon,t,d,a,c,locked){return'<button class="card block'+(locked?' locked':'')+'" onclick="'+a+'"><span class="top" style="background:'+c+'"></span><div class="body"><div class="ic"><svg viewBox="0 0 24 24" style="width:100%;height:100%" fill="'+c+'" color="'+c+'">'+iconPath(icon)+'</svg></div><h3>'+t+'</h3><p>'+d+'</p></div></button>'}
function renderHome(){var s=DATA.stats;$("screen").innerHTML='<section class="hero block"><div class="big-av">'+avatarSVG(DATA.avatar)+'</div><div class="htxt"><h2>Hi, '+esc(DATA.name||"explorador")+'! 👋</h2><p>'+course().label+' · '+(DATA.grade>=3?'Frases, escucha y comprensión':'Aprende jugando paso a paso')+'</p><div class="stat-row"><span class="stat">✅ '+s.correct+' aciertos</span><span class="stat">🔥 '+s.best+' racha</span><span class="stat">🏅 '+achievementCount()+'/12</span></div></div></section><div class="section-title">ELIGE TU MISIÓN</div><section class="grid">'+card("globe","Mundos","Aprende palabras por temas","showThemes('study')","var(--teal)",false)+card("sound","Escucha","Oye la palabra y elige","showThemes('listen')","#4cb4e8",false)+card("abc","Frases","Ordena las palabras","startSentences()","var(--coral)",false)+(DATA.grade>=3?card("book","Reading","Comprende pequeños textos","startReading()","#8c70e8",!OrbitakidxAccess.hasFullAccess()):"")+card("target","Examen","Mezcla las misiones","startExam()","var(--gold)",!OrbitakidxAccess.hasFullAccess())+card("star","Medallas","Completa la colección","showMedals()","var(--purple)",false)+card("trophy","Progreso","Tu pasaporte de inglés","showProgress()","var(--green)",false)+'</section>'}
function goHome(){QUIZ=STUDY=SENT=READ=null;renderHome();window.scrollTo(0,0)}
function showThemes(mode){sfx("tap");var themes=courseThemes(),h=backBar(mode==="listen"?"Escucha y elige":"Mundos de palabras")+'<div class="panel block"><p class="sub">Contenido recomendado para '+course().label+'. Puedes cambiar el curso arriba.</p><div class="theme-grid">';themes.forEach(function(t,i){var c=(DATA.themes[t.id]&&DATA.themes[t.id].correct)||0;h+='<div class="theme'+lockClass(themeOpen(i))+'" style="--world:'+t.color+'" onclick="'+(mode==="listen"?'startWordQuiz('+i+',\'listen\')':'openStudy('+i+')')+'"><div class="big">'+t.emoji+'</div><b>'+t.name+'</b><small>'+t.description+'</small><div class="progress"><i style="width:'+Math.min(100,c*10)+'%;background:'+t.color+'"></i></div></div>'});h+='</div></div>';$("screen").innerHTML=h}
function openStudy(i){if(!requireTheme(i))return;sfx("start");STUDY={themes:courseThemes(),theme:i,index:0};renderStudy()}function renderStudy(){var t=STUDY.themes[STUDY.theme],w=t.words[STUDY.index];$("screen").innerHTML=backBar(t.name)+'<div class="study block"><div class="eyebrow">PALABRA '+(STUDY.index+1)+' DE '+t.words.length+'</div><div class="word-emoji">'+w.emoji+'</div><div class="english">'+w.en+'</div><div class="spanish">'+w.es+'</div><button class="speaker" onclick="speak(\''+w.en.replace(/'/g,"\\'")+'\')">🔊</button><div class="actions"><button class="btn ghost" onclick="studyMove(-1)">←</button><button class="btn green" onclick="studyMove(1)">Siguiente →</button></div></div><div class="actions"><button class="btn coral" onclick="startWordQuiz('+STUDY.theme+',\'meaning\')">Practicar</button></div>';setTimeout(function(){speak(w.en)},180)}function studyMove(d){sfx("tap");var t=STUDY.themes[STUDY.theme];STUDY.index=(STUDY.index+d+t.words.length)%t.words.length;renderStudy()}
function allWords(){var a=[];courseThemes().forEach(function(t,ti){t.words.forEach(function(w){a.push({en:w.en,es:w.es,emoji:w.emoji,theme:ti,id:t.id})})});return a}function choicesFor(w,key,pool){var a=[w[key]],o=shuffle(pool.filter(function(x){return x[key]!==w[key]}));for(var i=0;i<o.length&&a.length<4;i++)a.push(o[i][key]);return shuffle(a)}
function startWordQuiz(i,type){if(!requireTheme(i))return;var themes=courseThemes(),t=themes[i],items=shuffle(t.words).slice(0,10).map(function(w){return{kind:type,word:w,choices:choicesFor(w,type==="listen"?"en":"es",t.words),theme:i,id:t.id}});startQuiz(items,t.name+(type==="listen"?" · Escucha":" · Palabras"),false)}function startQuiz(items,label,exam){sfx("start");QUIZ={items:items,index:0,correct:0,streak:0,answered:false,label:label,exam:!!exam};renderQuiz()}
function startExam(){if(!OrbitakidxAccess.requireLevel("dificil",true))return;var pool=allWords(),items=shuffle(pool).slice(0,12).map(function(w,n){var type=n%2?"listen":"meaning";return{kind:type,word:w,choices:choicesFor(w,type==="listen"?"en":"es",pool),theme:w.theme,id:w.id}});startQuiz(items,"Examen galáctico",true)}
function renderQuiz(){var q=QUIZ.items[QUIZ.index],listen=q.kind==="listen",prompt=listen?'¿Qué palabra escuchas?':'¿Qué significa <b>'+q.word.en+'</b>?',answers="";q.choices.forEach(function(c,i){answers+='<button class="answer" id="ans'+i+'" onclick="answerQuiz('+i+')">'+c+'</button>'});$("screen").innerHTML=backBar(QUIZ.label)+'<div class="quiz-head"><b>Pregunta '+(QUIZ.index+1)+'/'+QUIZ.items.length+'</b><b>🔥 '+QUIZ.streak+'</b></div><div class="progress"><i style="width:'+(QUIZ.index/QUIZ.items.length*100)+'%"></i></div><div class="question block" style="margin-top:12px"><div class="qemoji">'+(listen?'🎧':q.word.emoji)+'</div><h2>'+prompt+'</h2>'+(listen?'<button class="speaker" onclick="speak(\''+q.word.en.replace(/'/g,"\\'")+'\')">🔊</button>':'<p class="sub">Elige la respuesta correcta</p>')+'<div class="answers">'+answers+'</div><div id="feedback"></div></div>';if(listen)setTimeout(function(){speak(q.word.en)},250)}
function answerQuiz(i){if(QUIZ.answered)return;QUIZ.answered=true;var q=QUIZ.items[QUIZ.index],right=q.kind==="listen"?q.word.en:q.word.es,ok=q.choices[i]===right;document.querySelectorAll(".answer").forEach(function(b,n){if(q.choices[n]===right)b.classList.add("ok");else if(n===i)b.classList.add("no")});DATA.stats.answered++;if(ok){QUIZ.correct++;QUIZ.streak++;DATA.stats.correct++;DATA.stats.streak++;DATA.stats.best=Math.max(DATA.stats.best,DATA.stats.streak);if(q.kind==="listen")DATA.stats.listen++;var ts=DATA.themes[q.id]||(DATA.themes[q.id]={correct:0});ts.correct++}else{QUIZ.streak=0;DATA.stats.streak=0}sfx(ok?"ok":"bad");save();$("feedback").innerHTML='<div class="feedback">'+(ok?'✅ Great!':'💡 Era <b>'+right+'</b>')+'<div class="actions"><button class="btn green" onclick="nextQuiz()">Continuar →</button></div></div>'}
function nextQuiz(){QUIZ.index++;QUIZ.answered=false;if(QUIZ.index>=QUIZ.items.length)return finishActivity(QUIZ.correct,QUIZ.items.length,"Palabras completadas");renderQuiz()}
function startSentences(){var free=DATA.grade<=2;if(!free&&!OrbitakidxAccess.requireLevel("medio",false))return;sfx("start");SENT={items:shuffle(CONTENT.sentences[DATA.grade]).slice(0,6),index:0,correct:0,selected:[],answered:false};renderSentence()}
function renderSentence(){var q=SENT.items[SENT.index],pool=shuffle(q[0].split(" "));SENT.pool=pool;SENT.selected=[];SENT.answered=false;var tok="";pool.forEach(function(w,i){tok+='<button class="token" id="tok'+i+'" onclick="pickToken('+i+')">'+w+'</button>'});$("screen").innerHTML=backBar("Construye la frase")+'<div class="quiz-head"><b>Frase '+(SENT.index+1)+'/'+SENT.items.length+'</b><b>⭐ '+SENT.correct+'</b></div><div class="question block"><div class="qemoji">🧩</div><h2>'+q[1]+'</h2><div class="sentence-box" id="built"><span class="sub">Toca las palabras…</span></div><div class="tokens">'+tok+'</div><div class="actions"><button class="btn ghost" onclick="undoToken()">↩ Deshacer</button><button class="btn green" onclick="checkSentence()">Comprobar</button></div><div id="feedback"></div></div>'}
function pickToken(i){if(SENT.answered||SENT.selected.indexOf(i)>=0)return;sfx("tap");SENT.selected.push(i);$("tok"+i).classList.add("used");renderBuilt()}function undoToken(){if(!SENT.selected.length||SENT.answered)return;sfx("tap");var i=SENT.selected.pop();$("tok"+i).classList.remove("used");renderBuilt()}function renderBuilt(){$("built").innerHTML=SENT.selected.length?SENT.selected.map(function(i){return'<span class="token">'+SENT.pool[i]+'</span>'}).join(""):'<span class="sub">Toca las palabras…</span>'}
function checkSentence(){if(SENT.answered)return;var q=SENT.items[SENT.index],built=SENT.selected.map(function(i){return SENT.pool[i]}).join(" ");if(SENT.selected.length!==SENT.pool.length)return toast("Todavía faltan palabras");SENT.answered=true;var ok=built===q[0];DATA.stats.answered++;if(ok){SENT.correct++;DATA.stats.correct++;DATA.stats.sentences++;speak(q[0])}sfx(ok?"ok":"bad");save();$("feedback").innerHTML='<div class="feedback">'+(ok?'✅ Perfect!':'💡 Orden correcto: <b>'+q[0]+'</b>')+'<div class="actions"><button class="btn green" onclick="nextSentence()">Continuar →</button></div></div>'}
function nextSentence(){SENT.index++;if(SENT.index>=SENT.items.length)return finishActivity(SENT.correct,SENT.items.length,"Frases construidas");renderSentence()}
function startReading(){if(!OrbitakidxAccess.requireLevel("dificil",false))return;sfx("start");var bank=CONTENT.readings[DATA.grade]||CONTENT.readings[3];READ={story:shuffle(bank)[0],index:0,correct:0,answered:false};renderReading()}
function renderReading(){var q=READ.story.questions[READ.index],answers="";shuffle(q[2]).forEach(function(a){answers+='<button class="answer" onclick="answerReading(this,\''+a.replace(/'/g,"\\'")+'\')">'+a+'</button>'});$("screen").innerHTML=backBar("Reading")+'<div class="panel block"><h2>'+READ.story.title+'</h2><div class="reading">'+READ.story.text+'</div><div class="eyebrow">QUESTION '+(READ.index+1)+'/'+READ.story.questions.length+'</div><h3>'+q[0]+'</h3><div class="answers">'+answers+'</div><div id="feedback"></div></div>'}
function answerReading(btn,a){if(READ.answered)return;READ.answered=true;var q=READ.story.questions[READ.index],ok=a===q[1];document.querySelectorAll(".answer").forEach(function(b){if(b.textContent===q[1])b.classList.add("ok")});if(!ok)btn.classList.add("no");DATA.stats.answered++;if(ok){READ.correct++;DATA.stats.correct++;DATA.stats.reading++}sfx(ok?"ok":"bad");save();$("feedback").innerHTML='<div class="feedback">'+(ok?'✅ Great reading!':'💡 Respuesta: <b>'+q[1]+'</b>')+'<div class="actions"><button class="btn green" onclick="nextReading()">Continuar →</button></div></div>'}
function nextReading(){READ.index++;READ.answered=false;if(READ.index>=READ.story.questions.length)return finishActivity(READ.correct,READ.story.questions.length,"Preguntas comprendidas");renderReading()}
function finishActivity(correct,total,label){DATA.stats.sessions++;if(correct===total)DATA.stats.perfect++;var nw=checkAchievements();sfx(nw.length?"medal":"win");save();$("screen").innerHTML=backBar("Resultado")+'<div class="study block"><div class="word-emoji">'+(correct/total>=.8?'🏆':'🌟')+'</div><div class="english">'+correct+'/'+total+'</div><div class="spanish">'+label+'</div>'+(nw.length?'<p><b>¡Nueva medalla!</b> '+nw.join(' ')+'</p>':'')+'<button class="btn coral" onclick="goHome()">Volver al inicio</button></div>'}
var ACH=[
 {id:"first",icon:"🌟",name:"First word",desc:"Primer acierto",ok:function(){return DATA.stats.correct>=1}},{id:"ten",icon:"🔟",name:"Ten words",desc:"10 aciertos",ok:function(){return DATA.stats.correct>=10}},
 {id:"listener",icon:"🎧",name:"Good listener",desc:"10 escuchas",ok:function(){return DATA.stats.listen>=10}},{id:"builder",icon:"🧩",name:"Sentence builder",desc:"5 frases",ok:function(){return DATA.stats.sentences>=5}},
 {id:"reader",icon:"📖",name:"Bookworm",desc:"3 preguntas leídas",ok:function(){return DATA.stats.reading>=3}},{id:"explorer",icon:"🗺️",name:"Explorer",desc:"3 mundos",ok:function(){return mastered(1)>=3}},
 {id:"fifty",icon:"🚀",name:"Rocket English",desc:"50 aciertos",ok:function(){return DATA.stats.correct>=50}},{id:"streak",icon:"🔥",name:"On fire",desc:"Racha de 10",ok:function(){return DATA.stats.best>=10}},
 {id:"perfect",icon:"🏆",name:"Perfect!",desc:"Partida perfecta",ok:function(){return DATA.stats.perfect>=1}},{id:"worlds",icon:"🌍",name:"Traveller",desc:"5 mundos",ok:function(){return mastered(5)>=5}},
 {id:"hundred",icon:"💯",name:"100 club",desc:"100 aciertos",ok:function(){return DATA.stats.correct>=100}},{id:"master",icon:"👑",name:"English master",desc:"Todos tus mundos",ok:function(){return mastered(5)>=courseThemes().length}}
];
function mastered(min){return courseThemes().filter(function(t){return DATA.themes[t.id]&&DATA.themes[t.id].correct>=min}).length}function checkAchievements(){var n=[];ACH.forEach(function(a){if(!DATA.achievements[a.id]&&a.ok()){DATA.achievements[a.id]=true;n.push(a.icon)}});return n}function achievementCount(){checkAchievements();return Object.keys(DATA.achievements).filter(function(k){return DATA.achievements[k]}).length}
function showMedals(){sfx("tap");checkAchievements();save();var h=backBar("Tus medallas")+'<div class="panel block"><p class="sub">Gana las primeras con la demo. Para completar la colección tendrás que conquistar todos los mundos.</p><div class="medal-grid">';ACH.forEach(function(a){var on=!!DATA.achievements[a.id];h+='<div class="medal '+(on?'on':'')+'"><div class="micon">'+(on?a.icon:'🔒')+'</div><b>'+a.name+'</b><small>'+a.desc+'</small></div>'});h+='</div></div>';$("screen").innerHTML=h}
function showProgress(){sfx("tap");var h=backBar("Pasaporte de inglés")+'<div class="panel block"><p class="sub">Progreso de '+course().label+'.</p><div class="theme-grid">';courseThemes().forEach(function(t,i){var c=(DATA.themes[t.id]&&DATA.themes[t.id].correct)||0;h+='<div class="theme'+lockClass(themeOpen(i))+'" style="--world:'+t.color+'" onclick="openStudy('+i+')"><div class="big">'+t.emoji+'</div><b>'+t.name+'</b><small>'+c+' aciertos</small><div class="progress"><i style="width:'+Math.min(100,c*10)+'%;background:'+t.color+'"></i></div></div>'});h+='</div></div>';$("screen").innerHTML=h}
updateTop();renderHome();if(DATA.onboarded)$("splash").style.display="none";OrbitakidxAccess.init().then(renderHome);window.scrollTo(0,0);
</script>
</body>
